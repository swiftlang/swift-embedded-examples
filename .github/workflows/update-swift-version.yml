name: Update Swift Version

permissions:
  contents: read

on:
  schedule:
    - cron: '0 0 */7 * *'  # Every 7 days at midnight UTC
  workflow_dispatch:

jobs:
  update-swift-version:
    name: Create or update PR
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl jq

      - name: Open pull request if needed
        id: update
        run: |
          set -ex

          git fetch
          branch=ci/update-swift-version
          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          remote=$(git rev-parse -q --verify "origin/$branch" || true)

          # Rebase an open PR onto main to keep commits pushed to it.
          # If the rebase conflicts, update the branch without a rebase.
          # Otherwise start again from main.
          rebase_failed=
          if [[ -n "$pr" && -n "$remote" ]]; then
            git checkout -B "$branch" "origin/$branch"
            if ! git rebase origin/main; then
              git rebase --abort
              rebase_failed=1
            fi
          else
            git checkout -B "$branch" origin/main
          fi

          uname=$(uname -m)
          curl -O "https://download.swift.org/swiftly/linux/swiftly-$uname.tar.gz"
          tar zxf "swiftly-$uname.tar.gz"
          ./swiftly init \
            --skip-install \
            --assume-yes \
            --quiet-shell-followup \
            --no-modify-profile
          . "$HOME/.local/share/swiftly/env.sh"

          swift_version=".swift-version"
          latest=$(swiftly list-available main-snapshot | grep main-snapshot | head -n 1 | awk '{print $1}')
          echo -n "$latest" > "$swift_version"
          echo "version=$latest" >> "$GITHUB_OUTPUT"

          title="Update to $latest"
          body="Updates the \`.swift-version\` file to Swift \`$latest\`.

          > This PR was automatically generated."

          if [[ -n "$(git status --porcelain "$swift_version")" ]]; then
            git add "$swift_version"
            git commit -m "$title" -m "$body"
          fi

          if git diff --quiet origin/main HEAD; then
            echo "main already uses $latest"
            exit 0
          fi

          # The lease stops the push if the branch changed during this run.
          if [[ "$(git rev-parse HEAD)" != "$remote" ]]; then
            git push --force-with-lease="$branch:$remote" origin "$branch"
            if [[ -n "$rebase_failed" ]]; then
              gh pr comment "$pr" --body "> [!WARNING]
          > Could not rebase \`$branch\` onto \`main\` because of a conflict. \
          Updated \`.swift-version\` without a rebase. Rebase this branch manually."
            fi
          fi

          if [[ -z "$pr" ]]; then
            gh pr create \
              --title "$title" \
              --body "$body" \
              --head "$branch" \
              --base "main" \
              --draft
          else
            gh pr edit "$pr" \
              --title "$title" \
              --body "$body"
          fi

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
